# ==============================================================================
# PROXY REVERSO NGINX CONTAINERIZADO — SIGAD FCJA (Docker Compose)
# Unifica o tráfego de Frontend (/), API (/api/) e Acervo Físico (/arquivos/)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Permite upload de documentos arquivísticos, matrizes digitais e planilhas até 100MB
    client_max_body_size 100M;

    # 1. API Backend (FastAPI / Gunicorn no container backend:8000)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 2. Download e Visualização de Documentos Capturados no Acervo (/arquivos/)
    location /arquivos/ {
        proxy_pass http://backend:8000/arquivos/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Documentação OpenAPI / Swagger do Backend
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $http_host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $http_host;
    }

    # 4. Interface Web do SIGAD FCJA (Container frontend:8080)
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
