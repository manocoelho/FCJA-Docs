# ==============================================================================
# DOCKER COMPOSE — SIGAD FCJA (Fundação Casa de José Américo)
# Orquestração completa para o Servidor Local da Fundação:
#   1. db       -> Banco de Dados Relacional MySQL 8.0 (UTF-8 / utf8mb4)
#   2. backend  -> API Arquivística Python FastAPI + Gunicorn/Uvicorn + OpenPyXL
#   3. frontend -> Interface Web React 19 + TanStack Start + Vite
#   4. nginx    -> Proxy Reverso Unificado (Porta 8085 padrão, coexistindo com AtoM)
#
# Como subir no servidor:
#   docker compose up -d --build
# ==============================================================================

services:
  db:
    image: mysql:8.0
    container_name: fcja_sigad_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FCJA_DB_ROOT_PASS:-fcja_root_segura_2026}
      MYSQL_DATABASE: ${FCJA_DB_NAME:-fcja_ged}
      MYSQL_USER: ${FCJA_DB_USER:-fcja_user}
      MYSQL_PASSWORD: ${FCJA_DB_PASS:-fcja_senha_segura_2026}
      TZ: America/Fortaleza
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - fcja_mysql_data:/var/lib/mysql
      - ./scripts/database/init_docker_mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - fcja_sigad_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fcja_sigad_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FCJA_DB_HOST: db
      FCJA_DB_PORT: "3306"
      FCJA_DB_NAME: ${FCJA_DB_NAME:-fcja_ged}
      FCJA_DB_USER: ${FCJA_DB_USER:-fcja_user}
      FCJA_DB_PASS: ${FCJA_DB_PASS:-fcja_senha_segura_2026}
      FCJA_PASTA_DADOS: /var/lib/fcja_dados
      FCJA_ARCHIVEMATICA_URL: ${FCJA_ARCHIVEMATICA_URL:-http://192.168.1.132}
      FCJA_STORAGE_SERVICE_URL: ${FCJA_STORAGE_SERVICE_URL:-http://192.168.1.132:8000}
      FCJA_ATOM_URL: ${FCJA_ATOM_URL:-http://192.168.1.110}
      FCJA_ARCHIVEMATICA_SHARED_DIR: ${FCJA_ARCHIVEMATICA_SHARED_DIR:-/var/archivematica/sharedDirectory/watchedDirectories/activeTransfers/standardTransfer}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TZ: America/Fortaleza
    ports:
      - "${FCJA_BACKEND_PORT:-8000}:8000"
    volumes:
      - fcja_arquivos_dados:/var/lib/fcja_dados
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/estatisticas"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fcja_sigad_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fcja_sigad_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000
      TZ: America/Fortaleza
    ports:
      - "${FCJA_FRONTEND_PORT:-8080}:8080"
    networks:
      - fcja_sigad_net

  nginx:
    image: nginx:1.27-alpine
    container_name: fcja_sigad_gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${FCJA_GATEWAY_PORT:-8085}:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fcja_sigad_net

volumes:
  fcja_mysql_data:
    name: fcja_sigad_mysql_data
  fcja_arquivos_dados:
    name: fcja_sigad_arquivos_dados

networks:
  fcja_sigad_net:
    name: fcja_sigad_network
    driver: bridge
